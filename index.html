<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="S_Games: أكبر منصة لأخبار و50,000 لعبة وخلفيات HD">
    <title>S_Games Ultimate HUB | 2026</title>
    <style>
        :root { --main: #00ff88; --bg: #05070a; --card: #111418; --text: #e6edf3; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; line-height: 1.6; }
        
        /* شريط التنقل العلوي */
        nav { background: rgba(0,0,0,0.9); padding: 15px; text-align: center; border-bottom: 2px solid var(--main); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        nav button { background: none; border: 1px solid var(--main); color: var(--main); padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 0 5px; font-weight: bold; transition: 0.3s; }
        nav button.active-btn { background: var(--main); color: black; }

        header { padding: 50px 20px; text-align: center; background: radial-gradient(circle at top, #0d2b1d, var(--bg)); }
        .search-box { width: 85%; max-width: 700px; padding: 18px; border-radius: 50px; border: 2px solid var(--main); background: #000; color: white; font-size: 1.2rem; outline: none; box-shadow: 0 0 20px rgba(0,255,136,0.1); }
        .search-box:focus { box-shadow: 0 0 30px rgba(0,255,136,0.3); }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }

        /* تنسيق الكروت */
        .card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; transition: 0.4s ease; position: relative; }
        .card:hover { transform: translateY(-10px); border-color: var(--main); box-shadow: 0 10px 30px rgba(0,255,136,0.1); }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .info { padding: 20px; }
        .title { font-size: 1.3rem; font-weight: bold; color: var(--main); margin-bottom: 10px; }
        .meta { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        
        /* أزرار المشاركة والتحميل */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; text-align: center; padding: 10px; border-radius: 5px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
        .share-wa { background: #25D366; color: white; }
        .download-btn { background: var(--main); color: black; }

        .section { display: none; }
        .active-section { display: block; }
        #status { text-align: center; padding: 50px; font-size: 1.5rem; color: var(--main); }
    </style>
</head>
<body>

<nav>
    <button id="btn-games" class="active-btn" onclick="openTab('games')">🎮 50,000 لعبة</button>
    <button id="btn-news" onclick="openTab('news')">📰 أخبار المطورين</button>
    <button id="btn-wallpapers" onclick="openTab('wallpapers')">🖼️ خلفيات HD</button>
</nav>

<div id="games" class="section active-section">
    <header>
        <h1>S_Games Global HUB</h1>
        <p>ابحث في أكثر من 50,000 عنوان وتعرف على المتطلبات</p>
        <input type="text" id="gameQuery" class="search-box" placeholder="اكتب اسم اللعبة بالإنجليزية واضغط Enter..." onkeyup="if(event.key==='Enter') searchGames()">
    </header>
    <div class="container">
        <div id="gameGrid" class="grid"></div>
    </div>
</div>

<div id="news" class="section">
    <header>
        <h1>أحدث أخبار المطورين والألعاب</h1>
    </header>
    <div class="container">
        <div id="newsGrid" class="grid"></div>
    </div>
</div>

<div id="wallpapers" class="section">
    <header>
        <h1>تحميل خلفيات ألعاب HD</h1>
        <p>أجمل الخلفيات لألعابك المفضلة بجودة عالية</p>
    </header>
    <div class="container">
        <div id="wallpaperGrid" class="grid"></div>
    </div>
</div>

<div id="status" style="display:none;">جاري تحديث البيانات...</div>

<script>
    // هذا المفتاح يربط موقعك بقاعدة بيانات تضم أكثر من 800,000 لعبة
    const KEY = '543a6d71391741549495b46e3364f981';

    function openTab(tabName) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-btn'));
        document.getElementById(tabName).classList.add('active-section');
        document.getElementById('btn-' + tabName).classList.add('active-btn');
        if(tabName === 'news') fetchNews();
        if(tabName === 'wallpapers') fetchWallpapers();
    }

    async function searchGames() {
        const query = document.getElementById('gameQuery').value;
        if(!query) return;
        toggleLoad(true);
        const res = await fetch(`https://api.rawg.io/api/games?key=${KEY}&search=${query}&page_size=30`);
        const data = await res.json();
        renderGames(data.results);
        toggleLoad(false);
    }

    async function fetchNews() {
        toggleLoad(true);
        // نجلب الألعاب التي صدرت حديثاً أو تم تحديثها في 2026
        const res = await fetch(`https://api.rawg.io/api/games?key=${KEY}&dates=2026-01-01,2026-12-31&ordering=-added&page_size=15`);
        const data = await res.json();
        renderNews(data.results);
        toggleLoad(false);
    }

    async function fetchWallpapers() {
        toggleLoad(true);
        // نجلب لقطات شاشة لألعاب مشهورة لاستخدامها كخلفيات
        const res = await fetch(`https://api.rawg.io/api/games?key=${KEY}&ordering=-rating&page_size=15`);
        const data = await res.json();
        renderWallpapers(data.results);
        toggleLoad(false);
    }

    function renderGames(items) {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = items.map(item => createCard(item, true)).join('');
    }

    function renderNews(items) {
        const grid = document.getElementById('newsGrid');
        grid.innerHTML = items.map(item => createCard(item, false, 'تاريخ الإصدار: ' + (item.released || 'قريباً'))).join('');
    }

    function renderWallpapers(items) {
        const grid = document.getElementById('wallpaperGrid');
        grid.innerHTML = items.map(item => {
            if(!item.background_image) return '';
            const downloadUrl = item.background_image;
            return `
                <div class="card">
                    <img src="${item.background_image}" loading="lazy">
                    <div class="info">
                        <div class="title">${item.name} Wallpaper</div>
                        <div class="btn-group">
                            <a href="${downloadUrl}" target="_blank" download class="action-btn download-btn">تحميل (HD)</a>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function createCard(item, isGame, metaText = '') {
        if(!item.background_image) return '';
        const shareWA = `https://api.whatsapp.com/send?text=شاهد هذه اللعبة على S_Games: ${item.name} - ${window.location.href}`;
        return `
            <div class="card">
                <img src="${item.background_image}" loading="lazy">
                <div class="info">
                    <div class="title">${item.name}</div>
                    ${metaText ? `<div class="meta">${metaText}</div>` : ''}
                    <div class="meta">⭐ التقييم: ${item.rating}/5</div>
                    <div class="btn-group">
                        <a href="${shareWA}" target="_blank" class="action-btn share-wa">واتساب ✅</a>
                    </div>
                </div>
            </div>
        `;
    }

    function toggleLoad(show) { document.getElementById('status').style.display = show ? 'block' : 'none'; }

    // عرض ألعاب مقترحة عند البدء
    window.onload = () => { searchGames(); openTab('games'); };
</script>

</body>
</html>
